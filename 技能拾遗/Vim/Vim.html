## 前言

<!--v-->

<div style="text-align: center;">
  <div style="display: inline-flex; align-items: center; vertical-align: middle; gap: 20px">
    <h2 style="margin: 0; padding: 0;">Vim的哲学</h2>
    <img src="Vimlogo.svg.png" alt="logo" style="height: 100px;">
  </div>
</div>

<br>

<p style="color: gray; text-align: justify; font-size: 1.2em">在编程的时候，你会把大量时间花在阅读/编辑而不是在写代码上。所以，Vim 是一个多模态编辑器：它对于插入文字和操纵文字有不同的模式。Vim 是可编程的（可以使用 Vimscript 或者像 Python 一样的其他程序语言），Vim 的接口本身也是一个程序语言：键入操作（以及其助记名）是命令，这些命令也是可组合的。Vim 避免了使用鼠标，因为那样太慢了；Vim 甚至避免用上下左右键因为那样需要太多的手指移动。</p>

<!--v-->

<br>

- <span style="color: red">高效性</span>

- <span style="color: red">轻量级</span>

- <span style="color: red">可移植性</span>

- <span style="color: red">可拓展性</span>

- <span style="color: red">高度语义化</span>

- <span style="color: red">批量处理化</span>

## Vim模式(cont.)

<br>

- <span style="color:red; font-weight: bold">Normal Mode</span>: 普通模式，是vim的默认模式，绝大部分操作都是在这个模式下进行的



- <span style="color:red; font-weight: bold">Visual Mode</span>: 可视化模式，可以细分成三个子模式：普通可视化模式(按<span style="color:red; font-weight=bold">v键</span>进入)，行可视化模式(按<span style="color:red; font-weight=bold">V键</span>进入)，块可视化模式(按<span style="color:red; font-weight=bold">Ctrl+v键</span>进入)，用于选中文本区域

  

- <span style="color:red; font-weight: bold">Insert Mode</span>: 插入模式，按<span style="color:red">i键</span>进入，基本等同于平时输入的方式

  

- <span style="color:red; font-weight: bold">Command Line Mode</span>: 命令行模式，按<span style="color:red">:键</span>进入，经常用于执行文件级别的操作

  

- <span style="color:red; font-weight: bold">Replace Mode*</span>:  替换模式，按<span style="color:red">R键进入</span>，依次替换光标处的字符，使用频率不高

<!--v-->

## Normal/Insert模式常用操作

- <span style="color:red; font-weight: bold">x</span>: 删除光标当前位置的字符

- <span style="color:red; font-weight: bold">r(replace)</span>: 替换光标当前位置的字符
- <span style="color:red; font-weight: bold">i(insert)</span>: 进入输入模式，从光标之前开始输入
- <span style="color:red; font-weight: bold">a(append)</span>: 进入输入模式，从光标之后开始输入
- <span style="color:red; font-weight: bold">o(open)</span>:  下方插入新的一行，进入输入模式
- <span style="color:red; font-weight: bold">I</span>:  进入输入模式，从行首开始输入
- <span style="color:red; font-weight: bold">A</span>:  进入输入模式，从行末开始输入
- <span style="color:red; font-weight: bold">O</span>:  上方插入新的一行，进入输入模式

<br>

- <span style="color:red; font-weight: bold">:w</span>: 保存当前文件

- <span style="color:red; font-weight: bold">:q</span>: 退出当前文件

- <span style="color:red; font-weight: bold">:q!</span>: 强制退出当前文件

## 行内移动

<p align="center"><span style="color: red; font-weight: bold">b</span>跳转到当前单词开头，<span style="color: red; font-weight: bold">e</span>跳转到当前单词末尾，<span style="color: red; font-weight: bold">w</span>跳转到下一单词开头</p>

![](./L2_bew.png)

<!--v-->

## 行内移动(cont.)

- <span style="color:red; font-weight: bold">0</span>: 跳转到行首

- <span style="color:red; font-weight: bold">$</span>: 跳转到行末
- <span style="color:red; font-weight: bold">^</span>: 跳转到本行首个非空白字符
- <span style="color:red; font-weight: bold">{num}_</span>: 跳转到光标下方第<span style="color:red; font-weight: bold">{num}</span>行的首个非空白字符，没有数字前缀时等同于<span style="color:red; font-weight: bold">^</span>
- <span style="color:red; font-weight: bold">%</span>: 跳转到括号的另一端，跨行也生效
- <span style="color:red; font-weight: bold">f{char} / t{char}</span>: 跳转到本行下一个<span style="color:red; font-weight: bold">{char}</span>字符出现处/出现前
- <span style="color:red; font-weight: bold">F{char} / T{char}</span>: 跳转到本行上一个<span style="color:red; font-weight: bold">{char}</span>字符出现处/出现后
- <span style="color:red; font-weight: bold">; / ,</span>:  对上述<span style="color:red; font-weight: bold">f / t</span>和<span style="color:red; font-weight: bold">F / T</span>操作的结果进行重复同向/反向查找

<!--v-->

## 跨行移动

- <span style="color:red; font-weight: bold">{num}j</span>: 光标向下移动<span style="color:red; font-weight: bold">{num}</span>行

- <span style="color:red; font-weight: bold">{num}k</span>: 光标向上移动<span style="color:red; font-weight: bold">{num}</span>行
- <span style="color:red; font-weight: bold">{</span>: 跳转到上一个非连续空行
- <span style="color:red; font-weight: bold">}</span>: 跳转到下一个非连续空行
- <span style="color:red; font-weight: bold">/{pattern}</span>: 按照<span style="color:red; font-weight: bold">正则表达式</span>跳转到下一个<span style="color:red; font-weight: bold">{pattern}</span>出现的位置
- <span style="color:red; font-weight: bold">?{pattern}</span>: 按照<span style="color:red; font-weight: bold">正则表达式</span>跳转到上一个<span style="color:red; font-weight: bold">{pattern}</span>出现的位置
- <span style="color:red; font-weight: bold">*</span>: 采用<span style="color:red; font-weight: bold">/{pattern}</span>的行为搜索当前光标下的单词
- <span style="color:red; font-weight: bold">n / N</span>:  对上述<span style="color:red; font-weight: bold">/</span>和<span style="color:red; font-weight: bold">?</span>操作的结果进行重复同向/反向查找

<!--v-->

## 页面移动

<br>

- <span style="color:red; font-weight: bold">gg</span>: 跳转到文件第一行

- <span style="color:red; font-weight: bold">G</span>: 跳转到文件最后一行
- <span style="color:red; font-weight: bold">Ctrl+u / Ctrl+d</span>: 向上/向下滚动半页
- <span style="color:red; font-weight: bold">Ctrl+b / Ctrl+f</span>: 向上/向下滚动整页
- <span style="color:red; font-weight: bold">{linenum}gg</span>: 跳转到第<span style="color:red; font-weight: bold">{linenum}</span>行
- <span style="color:red; font-weight: bold">zz / zt / zb</span>: 光标聚焦到屏幕中央/顶部/底部

## 标记移动(cont.)

- <span style="color:red; font-weight: bold">m{mark}</span>: 将当前光标位置标记为<span style="color:red; font-weight: bold">{mark}</span>

- <span style="color:red; font-weight: bold">`{mark}</span>: 跳转到标记<span style="color:red; font-weight: bold">{mark}</span>位置

## 常用的编辑动作

- <span style="color:red; font-weight: bold">c(change)</span>: 删除内容并进入插入模式

- <span style="color:red; font-weight: bold">d(delete)</span>: 删除内容
- <span style="color:red; font-weight: bold">y(yank)</span>: 复制文本内容
- <span style="color:red; font-weight: bold">p(paste)</span>: 粘贴文本内容。如果<span style="color:red; font-weight: bold">yank</span>的是一整行，那么粘贴时会在光标下方新起一行

<span style="color:red; font-weight: bold">c</span>、<span style="color:red; font-weight: bold">d</span>、<span style="color:red; font-weight: bold">y</span>指令往往需要结合移动指令来形成完整的指令。例如，<span style="background-color: #e0e0e0; color: red; padding: 2px 4px; border-radius: 4px; font-family: monospace;">ce</span>是改变从光标处到单词末尾的内容，<span style="background-color: #e0e0e0; color: red; padding: 2px 4px; border-radius: 4px; font-family: monospace;">ggdG</span>是删除文件内的所有内容，<span style="background-color: #e0e0e0; color: red; padding: 2px 4px; border-radius: 4px; font-family: monospace;">yt,</span>是复制从光标处到逗号处的内容

这三个编辑指令连续按两次，表示作用于光标所在行。例如，<span style="background-color: #e0e0e0; color: red; padding: 2px 4px; border-radius: 4px; font-family: monospace;">cc</span>表示修改一整行内容

<!--v-->

## 重复上次的修改操作

<p align="center"><span style="color: red; font-weight: bold">.</span>命令可以重复上一次的修改操作，在需要多次执行同一修改操作的情景下会很有用</p>

<img src="./L2_04.gif" style="zoom:67%;" />

## 批量动作

<br>

在Vim中，移动指令是可以搭配数字来使用的，例如<span style="color: red; font-weight: bold">3w</span>表示移动到后方第三个单词的开头

而编辑动作通常会和移动指令组合，所以就会创造出以下操作：

- <span style="color:red; font-weight: bold">c3w</span>或<span style="color:red; font-weight: bold">3cw</span>: 改变从光标处到后方第三个单词开头前的内容

- <span style="color:red; font-weight: bold">d2j</span>或<span style="color:red; font-weight: bold">2dj</span>: 删除本行以及下两行的内容
- <span style="color:red; font-weight: bold">3yy</span>: 复制三行内容

## 插件: Vim-surround

<br>

有时，我们不仅需要修改配对符里的内容，还需要修改配对符本身，而Vim本身并没有提供相应的功能，所以我们可以依靠插件<span style="color:red; font-weight: bold">vim-surround</span>来实现

## 寄存器

Vim提供了用于缓存文本内容的<span style="color:red; font-weight: bold">寄存器</span>，编辑操作总会把原本的文本内容缓存到默认寄存器

<span style="color:red; font-weight: bold">常规寄存器</span>: 用<span style="color:red; font-weight: bold">{a-z}</span>和<span style="color:red; font-weight: bold">{0-9}</span>等字符来引用

<span style="color:red; font-weight: bold">特殊寄存器</span>: 

- <span style="color:red; font-weight: bold">"</span>: Vim默认寄存器，<span style="color:red; font-weight: bold">复制</span>、<span style="color:red; font-weight: bold">改变</span>、<span style="color:red; font-weight: bold">删除</span>等操作的文本内容都会被存放在此寄存器中

- <span style="color:red; font-weight: bold">%</span>: 存放着文件名
- <span style="color:red; font-weight: bold">+</span>: 系统寄存器
- <span style="color:red; font-weight: bold">.</span>: 存放上次插入的内容
- <span style="color:red; font-weight: bold">:</span>: 存放上次执行的指令

通过<span style="color:red; font-weight: bold">:reg {reg_name}</span>可以查看寄存器中存放的内容

<!--v-->

## 指定操作使用的寄存器

<br>

当我们想要指定编辑操作使用的寄存器时，可以在相应指令之前加上<span style="color:red; font-weight: bold">"{reg_name}</span>来进行寄存器切换

例如，

- <span style="color:red; font-weight: bold">"+yy</span>: 将光标所在行的内容复制到系统剪切板

- <span style="color:red; font-weight: bold">"Adw</span>: 将删除的单词内容<span style="color:red; font-weight: bold">追加</span>存放到<span style="color:red; font-weight: bold">a</span>寄存器
- <span style="color:red; font-weight: bold">"ap</span>: 将<span style="color:red; font-weight: bold">a</span>寄存器的内容粘贴出来

<!--v-->

## 宏(Macro)

<p align="center">录制一系列键盘操作，并允许我们重放这些操作</p>

- <span style="color:red; font-weight: bold">q{reg_name}</span>: 将键盘操作录制到<span style="color:red; font-weight: bold">{reg_name}</span>寄存器下，再次按<span style="color:red; font-weight: bold">q</span>退出录制

- <span style="color:red; font-weight: bold">@{reg_name}</span>: 重放<span style="color:red; font-weight: bold">{reg_name}</span>寄存器下保存的操作
- <span style="color:red; font-weight: bold">@@</span>: 重放上一次宏操作

录制宏时应当考虑宏的<span style="color:red; font-weight: bold">泛用性</span>，保证在各种变化下都能产生相同的执行效果。例如，可以在操作前，先把光标移动到行首，再执行其他操作

## 基本Ex命令

<p align="center">由<span style="color:red; font-weight: bold">range</span>、<span style="color:red; font-weight: bold">command</span>、<span style="color:red; font-weight: bold">flag(非必要)</span>三部分构成</p>

例如，

- <span style="color: orange; font-weight: bold">:% delete a</span>: <span style="color:red; font-weight: bold">%</span>表示作用于整个文件，所以这个指令就是将整个文件全部删除，并将删除的内容存放到<span style="color:red; font-weight: bold">a</span>寄存器中

- <span style="color: orange; font-weight: bold">:2,4 yank</span>: 表示复制第2行到第4行的内容
- <span style="color: orange; font-weight: bold">:.+1, $-2 print</span>: 表示打印光标下方一行直到倒数第三行的内容(<span style="color:red; font-weight: bold">\$</span>表示最后一行)

这里的<span style="color:red; font-weight: bold">flag</span>就是第一个指令中的寄存器<span style="color:red; font-weight: bold">a</span>

<!--v-->

## 行的复制、移动和粘贴

<br>

- <span style="color: orange; font-weight: bold">:[range] copy {address}</span>: 表示将<span style="color:red; font-weight: bold">range</span>包含的所有行复制到<span style="color:red; font-weight: bold">address</span>后

- <span style="color: orange; font-weight: bold">:[range] move {address}</span>: 表示将<span style="color:red; font-weight: bold">range</span>包含的所有行移动到<span style="color:red; font-weight: bold">address</span>后
- <span style="color: orange; font-weight: bold">:{address} put {reg_name}</span>: 表示将<span style="color:red; font-weight: bold">{reg_name}</span>存放的内容粘贴到<span style="color:red; font-weight: bold">address</span>后

例如，当我们想要将第一行、第三行、第五行的内容粘贴到文本末尾时，可以采取

```cmd
:1 yank a
:3 yank A
:5 yank A
:$ put a
```

来实现

<!--v-->

## Normal命令

<br>

<span style="color: orange; font-weight: bold">:[range] normal {commands}</span>: 对范围内的所有行执行normal模式下的<span style="color: red; font-weight: bold">commands</span>命令

另外Normal命令还可以配合<span style="color: red; font-weight: bold">.</span>命令和<span style="color: red; font-weight: bold">宏</span>使用

- <span style="color: orange; font-weight: bold">:[range] normal .</span>: 对范围内所有行重复执行上次的修改操作
- <span style="color: orange; font-weight: bold">:[range] normal @{reg_name}</span>: 对范围内所有行重放<span style="color: red; font-weight: bold">{reg_name}</span>中存放的宏操作

<!--v-->

## Global命令

<br>

<span style="color: orange; font-weight: bold">:[range] global/{pattern}/{command}</span>: 对范围内所有符合<span style="color: red; font-weight: bold">{pattern}</span>的行执行command模式下的Ex命令，缺省为<span style="color: red; font-weight: bold">print</span>

Global命令可以嵌套Normal命令使用，达到相当强大的效果

例如，删除全文中的单行注释，可以使用<span style="color: orange; font-weight: bold">:% g/\\/\\//normal /\\s\*\\/\\/\<CR\>d$</span>来实现，原理是先用global筛选出带有<span style="color: red; font-weight: bold">//</span>的行(<span style="color: red; font-weight: bold">/</span>需要进行转义)，然后用<span style="color: red; font-weight: bold">\s\*\/\/</span>匹配<span style="color: red; font-weight: bold">//</span>以及前方的空白字符，<span style="color: red; font-weight: bold">\<CR\></span>表示回车，需要通过<span style="color: red; font-weight: bold">Ctrl+v+回车</span>来进行特殊输入，表示确认搜索，最后用<span style="color: red; font-weight: bold">d\$</span>，来删除后方所有内容

## 全文文本替换(cont.)

<span style="color: orange; font-weight: bold">:[range]s/{pattern}/{text}/{flags}</span>: 表示将符合<span style="color: red; font-weight: bold">{pattern}</span>的字符串替换成<span style="color: red; font-weight: bold">{text}</span>

<span style="color: red; font-weight: bold">{flags}</span>包含：

- <span style="color: red; font-weight: bold">g</span>: 表示global，全局生效

- <span style="color: red; font-weight: bold">i</span>: 表示大小写不敏感
- <span style="color: red; font-weight: bold">c</span>: 对每一个匹配项替换前进行确认
- <span style="color: red; font-weight: bold">n</span>: 计数

例如，<span style="color: orange; font-weight: bold">:%s/vim//gn</span>会统计文件中<span style="color: red; font-weight: bold">vim</span>出现的次数，而不关注中间<span style="color: red; font-weight: bold">{text}</span>部分的内容

对于之前提到过的“删除全文中的单行注释”，也可以使用<span style="color: orange; font-weight: bold">:%s/\\s\*\\/\\/.\*//g</span>来实现
