## Shell简介

<br>

在Linux系统中，<span style="color: red; font-weight: bold" >Kernel</span>是操纵计算机底层硬件的组件。计算机执行程序时，时时刻刻需要硬件的协调，而事实上这个过程是由用户对Kernel发起系统调用请求，由Kernel间接调用硬件来实现的，用户并没有直接操纵硬件的权限。另外，在早期的操作系统中，与操作系统直接交互往往非常复杂和不友好。因此，为了隔绝Kernel和用户层，防止用户直接干涉硬件，以及提高用户的体验，就出现了用户与操作系统的之间的交互接口——Shell

![](./L1_01.png)

<!--v-->

## Shell和终端的区别

<br>

<span style="color: red; font-weight: bold">Shell</span>

- Shell是一个用c语言编写的程序语言，它是用户使用Linux的桥梁，Shell既是一种命令语言，又是一种程序设计语言
- Shell是一种解释型语言，这种语言经过编写后不经过任何编译就可以执行，是一种脚本语言。和编译型语言是执行前翻译不同，解释型语言的程序是执行时翻译
- Shell的主要功能是提供命令解释和执行的能力。它允许用户执行操作系统任务，如管理文件、运行程序和控制进程。Shell也支持编写脚本，实现自动化任务。
- <span style="color: navy; font-weight: bold">例子</span>: Bash（Bourne Again Shell）、Zsh（Z Shell）、Fish（Friendly Interactive Shell）等。

<!--v-->

## Shell和终端的区别

<br>

<span style="color: red; font-weight: bold">终端</span>

- 终端（或终端仿真器）是一个软件程序，它模拟了传统的物理终端机的功能。终端为用户提供了一个与Shell交互的界面。
- 终端的主要作用是作为用户与Shell之间的通信桥梁。它允许用户输入命令，并显示来自Shell的输出。现代的终端仿真器提供了诸如标签页、颜色支持、字体调整等功能。
- <span style="color: navy; font-weight: bold">例子</span>: Windows的命令提示符、PowerShell，macOS的Terminal、iTerm，Linux的GNOME Terminal、Konsole等。

<!--v-->

## Shell的两种形式

<br>

- <span style="color: red; font-weight: bold">命令行界面</span>**(Command Line Interface, CLI)**: 这是Shell最常见的形式，它允许用户通过文本命令与计算机交互。用户可以输入命令，Shell则解释这些命令，并调用操作系统的相应功能来执行。这种Shell提供了强大的脚本语言支持，使得用户可以编写脚本来自动化各种任务。

- <span style="color: red; font-weight: bold">图形用户界面</span>**(Graphical User Interface, GUI)**: 虽然通常不称作Shell，但GUI也是一种用户界面，它提供图形化的方式来与操作系统交互。在某些操作系统中，比如Windows，GUI是主要的交互方式，但在其他系统中，比如Linux或Unix，命令行Shell更常见。

<!--v-->

## Shell的分类

<br>

常见的Shell包括：

- <span style="color: red; font-weight: bold">Bash</span>**(Bourne Again SHell)**: Linux和Mac OS X的默认Shell，非常强大，支持复杂的脚本和任务自动化。

- <span style="color: red; font-weight: bold">Zsh</span>**(Z SHell)**: 类似Bash，但提供更多的特性和定制选项。

- <span style="color: red; font-weight: bold">Fish</span>**(Friendly Interactive SHell)**: 用户友好，易于使用的现代Shell。

- <span style="color: red; font-weight: bold">CMD.exe</span>: Windows的传统命令行界面。

- <span style="color: red; font-weight: bold">PowerShell</span>: Windows的先进命令行界面，集成了脚本语言。

## 在不同的目录中进行切换

<br>

<span style="color: red; font-weight: bold">cd指令</span>将是我们使用得最频繁的指令，它可以让我们切换到不同的目录下，进而简化我们的操作难度（否则我们每次都需要去指示操作的目录，这会十分繁琐）

cd指令包含以下常用方式：

- <span style="color: red; font-weight: bold">cd [target dir]</span>: 切换到指定的目录，这里可以是<span style="color: navy; font-weight: bold">相对路径或是绝对路径</span>

- <span style="color: red; font-weight: bold">cd ~</span>: 切换到<span style="color: navy; font-weight: bold">home</span>目录
- <span style="color: red; font-weight: bold">cd -</span>: 切换到上次所在的目录，<span style="color: navy; font-weight: bold">可以使用该指令实现两个目录间的频繁切换</span>
- <span style="color: red; font-weight: bold">cd ..</span>: 切换到上级目录

## 查看文件内容

<br>

- <span style="color: red; font-weight: bold">less指令</span>：针对于大型文本文件，可以进行分页查看，通过键盘上下箭头键或page up、page down键进行翻页
- <span style="color: red; font-weight: bold">head指令</span>：快速查看文件的开始部分，默认情况下，只显示文件的前10行。
- 可以指定选项来控制行数，例如 <span style="color: orange; font-weight: bold">head -n 20 [filename]</span> ，则可以查看指定文件的前20行
- <span style="color: red; font-weight: bold">tail指令</span>：类似于head指令，快速查看文件的末尾部分，默认情况下，只显示文件的最后10行
- 可以指定选项来控制行数，例如 <span style="color: orange; font-weight: bold">tail -n 20 [filename]</span> ，则可以查看指定文件的末尾20行

## 文本排序

<br>

使用<span style="color: red; font-weight: bold">sort指令</span>可以对文本进行排序，格式为 <span style="color: orange; font-weight: bold">sort [filename]</span>，它会按照字典序对文本中的行进行排列

可选选项：

- <span style="color: red; font-weight: bold">-n</span>：基于数值而不是字母顺序进行排序。
- <span style="color: red; font-weight: bold">-r</span>：逆序排序。
- <span style="color: red; font-weight: bold">-k</span>：指定排序依据的列。例如，<span style="color: orange; font-weight: bold">sort -k 2 filename.txt</span> 会根据第二列的内容排序。
- <span style="color: red; font-weight: bold">-u</span>：删除重复行，只保留唯一行。

## 重定向

**标准输出重定向（<span style="color: red; font-weight: bold">></span> 和 <span style="color: red; font-weight: bold">>></span>）**:

- <span style="color: red; font-weight: bold">></span>用于将命令的输出重定向到一个文件，如果文件已存在，则会被覆盖。
  - 例如，<span style="color: orange; font-weight: bold">ls > filelist.txt</span> 将当前目录的内容列表输出到 <span style="color: blue; font-weight: bold">filelist.txt</span>，覆盖该文件原有内容。

- <span style="color: red; font-weight: bold">>></span>用于将命令的输出附加到一个文件的末尾，而不是覆盖它。
  - 例如，<span style="color: orange; font-weight: bold">ls >> filelist.txt</span> 将当前目录的内容列表追加到 <span style="color: blue; font-weight: bold">filelist.txt</span> 的末尾。

**标准错误重定向（<span style="color: red; font-weight: bold">2></span> 和 <span style="color: red; font-weight: bold">2>></span>）**:

- 与标准输出重定向类似，但它是针对命令的错误信息。
  - 例如，<span style="color: orange; font-weight: bold">grep 'text' nonexistfile.txt 2> errorlog.txt</span> 将错误信息（在这里是因为 <span style="color: blue; font-weight: bold">nonexistfile.txt</span> 不存在）重定向到 <span style="color: blue; font-weight: bold">errorlog.txt</span>。

## 管道

管道可以将一个命令的输出与一个命令的输入连接起来

**简单管道**:

- 例如，<span style="color: orange; font-weight: bold">ls | sort</span> 将 <span style="color: red; font-weight: bold">ls</span> 命令的输出（当前目录的文件列表）直接传递给 <span style="color: red; font-weight: bold">sort</span> 命令，对文件列表进行排序。

**管道与 <span style="color: red; font-weight: bold">grep</span>**:

- 你可以结合管道和 <span style="color: red; font-weight: bold">grep</span> 来搜索特定的输出。例如，<span style="color: orange; font-weight: bold">ls -l | grep '^d'</span> 会列出当前目录中所有的目录（<span style="color: red; font-weight: bold">'^d'</span>表示匹配以d开头的字符串，在<span style="color: red; font-weight: bold">ls -l</span>的输出结果中也就对应了目录）。

**多重管道**:

- 可以将多个命令通过管道连接起来。例如，<span style="color: orange; font-weight: bold">cat file.txt | grep 'text' | sort</span> 会首先显示 <span style="color: blue; font-weight: bold">file.txt</span> 的内容，然后从中筛选包含 "text" 的行，最后对这些行进行排序。

## gcc编译指令

在我们有多个文件需要放在一起编译时，例如<span style="color: blue; font-weight: bold">add.c</span>，<span style="color: blue; font-weight: bold">subtract.c</span>，<span style="color: blue; font-weight: bold">multiply.c</span>，<span style="color: blue; font-weight: bold">divide.c</span>，<span style="color: blue; font-weight: bold">main.c</span>，我们使用gcc指令进行编译

```bash
gcc 'add.c' 'subtract.c' 'multiply.c' 'divide.c' 'main.c' -o 'program'
```

## find指令

<span style="color: red; font-weight: bold">find</span> 命令是 Unix 和类 Unix 系统中用于基于各种条件搜索文件的强大工具

例如要对所有 <span style="color: blue; font-weight: bold">.txt</span> 文件进行权限修改

```bash
find . -iname "*.txt" -exec chmod 777 {} \;
```

这里 <span style="color: red; font-weight: bold">.</span> 表示当前目录，<span style="color: red; font-weight: bold">-iname </span>表示不区分大小写的文本匹配，<span style="color: red; font-weight: bold">*.txt</span> 是匹配的模式，表示以 <span style="color: blue; font-weight: bold">.txt</span> 结尾的文件，<span style="color: red; font-weight: bold">-exec</span> 紧跟要执行的指令，这里是用了 <span style="color: red; font-weight: bold">chmod</span> 指令，<span style="color: red; font-weight: bold">{}</span> 指代前面find找到的所有文件，<span style="color: red; font-weight: bold">\\;</span> 表示结束，由于分号会有歧义，所以需要转义

<!--v-->

## find指令(cont.)

类似地，还可以这样写

```bash
find . -type f -exec rm {} \;
```

<span style="color: red; font-weight: bold">-type</span> 表示查找文件类型，<span style="color: red; font-weight: bold">f</span> 表示文件（<span style="color: red; font-weight: bold">d</span> 表示目录），这个指令就是该目录下删除所有文件

<span style="color:navy; font-weight: bold">要注意的是，find指令是会递归执行的，所以包括它子目录里的文件都会受到影响</span>
